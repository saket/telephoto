[versions]
minSdk = "21"
compileSdk = "35"
kotlin = "2.1.0" # https://kotlinlang.org/docs/releases.html#release-details
agp = "8.9.1"  # https://maven.google.com/web/index.html?q=gradle.plugin#com.android.library:com.android.library.gradle.plugin
compose-multiplatform = "1.7.3" # https://github.com/JetBrains/compose-multiplatform/releases
androidx-compose-runtime = "1.7.8" # https://developer.android.com/jetpack/androidx/releases/compose-runtime
androidx-compose-ui = "1.7.8" # https://developer.android.com/jetpack/androidx/releases/compose-ui
androidx-compose-ui-material3 = "1.3.1" # https://developer.android.com/jetpack/androidx/releases/compose-material3
androidx-annotation = "1.9.1"
androidx-appcompat = "1.7.0"
androidx-activity = "1.10.1"  # https://developer.android.com/jetpack/androidx/releases/activity
androidx-exif = "1.4.0" # https://developer.android.com/jetpack/androidx/releases/exifinterface
androidx-tracing = "1.2.0" # https://developer.android.com/jetpack/androidx/releases/tracing
androidx-ktx = "1.15.0"  # https://developer.android.com/jetpack/androidx/releases/core
androidx-ktx-palette = "1.0.0"
androidx-test-core = "1.6.1"  # https://developer.android.com/jetpack/androidx/releases/test
androidx-test-rules = "1.6.1"  # https://developer.android.com/jetpack/androidx/releases/test
androidx-test-runner = "1.6.2"  # https://developer.android.com/jetpack/androidx/releases/test
androidx-test-junit = "1.2.1"
androidx-test-uiautomator = "2.3.0"  # https://developer.android.com/jetpack/androidx/releases/test-uiautomator
accompanist = "0.37.2"  # https://github.com/google/accompanist/releases
testParamInjector = "1.18"
junit = "4.13.2"
coil = "2.7.0"  # https://github.com/coil-kt/coil/blob/main/CHANGELOG.md
coil3 = "3.1.0"  # https://github.com/coil-kt/coil/blob/main/CHANGELOG.md
glide = "4.15.1"
turbine = "1.2.0"  # https://github.com/cashapp/turbine/releases/
paparazzi = "1.3.4" # https://github.com/cashapp/paparazzi/releases
molecule = "2.0.0"  # https://github.com/cashapp/molecule/releases
leakcanary = "3.0-alpha-1"  # https://square.github.io/leakcanary/changelog/
kotlinx-coroutines = "1.10.1"  # https://github.com/kotlin/kotlinx.coroutines/releases
kotlinx-immutableCollections = "0.3.8" # https://github.com/Kotlin/kotlinx.collections.immutable/releases
mavenPublish = "0.30.0"
dropshots = "0.4.1"
dropboxDiffer = "0.0.2" # https://github.com/dropbox/differ/blob/main/CHANGELOG.md
emulatorWtfPlugin = "0.18.0"  # https://docs.emulator.wtf/changelog/
emulatorWtfCli = "0.11.1"  # https://docs.emulator.wtf/changelog/
okio = "3.10.2" # https://github.com/square/okio/releases
okhttp-mockWebServer = "4.12.0"
dokka = "1.9.20"
assertk = "0.28.1"
circuit = "0.13.0-beta01"
espresso-core = "3.6.1"
espresso-device = "1.0.1"
robolectric = "4.14.1"
benchmark-macro-junit4 = "1.3.3"
metalava = "0.3.5"  # https://github.com/tylerbwong/metalava-gradle/releases
poko = "0.17.2" # https://github.com/drewhamilton/Poko/blob/main/CHANGELOG.md
composeLintChecks = "1.4.2" # https://slackhq.github.io/compose-lints/changelog/
modernstorage = "1.0.0-alpha08" # https://github.com/saket/modernstorage/releases

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dropshots = { id = "com.dropbox.dropshots", version.ref = "dropshots" }
emulatorWtf = { id = "wtf.emulator.gradle", version.ref = "emulatorWtfPlugin" }
metalava = { id = "me.tylerbwong.gradle.metalava", version.ref = "metalava" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }

[libraries]
# Build logic dependencies
plugin-agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-jetbrains-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
plugin-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
plugin-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
plugin-dropshots = { module = "com.dropbox.dropshots:dropshots-gradle-plugin", version.ref = "dropshots" }
plugin-emulatorWtf = { module = "wtf.emulator:gradle-plugin", version.ref = "emulatorWtfPlugin" }
plugin-metalava = { module = "me.tylerbwong.gradle.metalava:plugin", version.ref = "metalava" }
plugin-poko = { module = "dev.drewhamilton.poko:poko-gradle-plugin", version.ref = "poko" }

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-ktx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-ktx" }
androidx-ktx-palette = { module = "androidx.palette:palette-ktx", version.ref = "androidx-ktx-palette" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity"}
androidx-exif = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exif"}
androidx-tracing = { module = "androidx.tracing:tracing-ktx", version.ref = "androidx-tracing"}

androidx-test-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
espresso-device = { module = "androidx.test.espresso:espresso-device", version.ref = "espresso-device" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark-macro-junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# TODO remove compose libs in favor of declaring via jetbrains compose plugin
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidx-compose-runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose-ui" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "androidx-compose-ui" }
compose-ui-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-ui-material3" }
compose-ui-materialIcons = { module = "androidx.compose.material:material-icons-extended", version.ref = "androidx-compose-ui" }
compose-ui-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
compose-ui-test-activityManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui" }

accompanist-drawablePainter = { module = "com.google.accompanist:accompanist-drawablepainter", version.ref = "accompanist" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
coil-test = { module = "io.coil-kt:coil-test", version.ref = "coil" }

coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil3" }
coil3-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil3" }
coil3-test = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil3" }
coil3-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }

glide-core = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-immutableCollections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-immutableCollections" }

okio-core = { module = "com.squareup.okio:okio", version.ref = "okio" }
